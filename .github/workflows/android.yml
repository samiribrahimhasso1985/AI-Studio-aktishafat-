# IKTISHAFAT Teleprompter – automatic build, tests and APK
# Runs on every push / pull request, and manually from the "Actions" tab.
name: Android build

on:
  push:
    branches: [ main, teleprompter-phase1 ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests + lint + APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Step "if" cannot read secrets directly, so expose whether signing is configured.
      HAS_SIGNING: ${{ secrets.IKT_KEYSTORE_BASE64 != '' && secrets.IKT_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests (engine, voice alignment, Arabic text, importers)
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # Signed release APK – only when the signing secrets are configured (see README).
      - name: Decode release keystore
        if: env.HAS_SIGNING == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.IKT_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Build signed release APK
        if: env.HAS_SIGNING == 'true'
        env:
          IKT_KEYSTORE_FILE: release.jks  # resolved from the project root
          IKT_KEYSTORE_PASSWORD: ${{ secrets.IKT_KEYSTORE_PASSWORD }}
          IKT_KEY_ALIAS: ${{ secrets.IKT_KEY_ALIAS }}
          IKT_KEY_PASSWORD: ${{ secrets.IKT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: iktishafat-teleprompter-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/

  device-tests:
    name: Instrumented tests on emulator (tablet)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests (Room database + Compose UI)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: app/build/reports/androidTests/

  publish:
    name: Publish APK (release + apk branch)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: iktishafat-teleprompter-apk
          path: apk

      - name: Collect APK
        run: |
          mkdir -p out
          cp "$(find apk -name 'app-debug.apk' | head -1)" out/IktishafatTeleprompter-debug.apk
          ls -la out

      - name: Publish as GitHub release (download directly on the tablet)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: IKTISHAFAT Teleprompter – latest debug build
          prerelease: true
          make_latest: true
          files: out/IktishafatTeleprompter-debug.apk
          body: |
            Debug build of branch ${{ github.ref_name }} at ${{ github.sha }}.
            Install: open this page on the tablet, download the APK, allow "Install unknown apps".

      - name: Push APK to the apk branch
        run: |
          cd out
          git init -q
          git checkout -q -b apk
          git add IktishafatTeleprompter-debug.apk
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "APK for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
